# Browser demo for classmates, including Hong Kong. The local tutor runs
# when ANTHROPIC_API_KEY is unset. Set that key with `fly secrets set`,
# never in this file.

app = "maple-english-demo"
primary_region = "hkg"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[env]
  MAPLE_PORT = "8080"
